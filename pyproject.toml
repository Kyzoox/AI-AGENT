[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "image-agent"
version = "0.1.0"
description = "Génération d'images pour LLM (serveur MCP + API REST) via l'API Gemini officielle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.30",
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
image-agent-mcp = "image_agent.mcp_server:main"
image-agent-api = "image_agent.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
